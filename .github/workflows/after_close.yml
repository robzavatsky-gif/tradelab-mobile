name: TradeLab after-close (simulated only)
on:
  schedule:
    # 4:35 p.m. ET during DST = 20:35 UTC; during standard time = 21:35 UTC.
    # Cloud script skips the early run; the second DST run is idempotent.
    - cron: '35 20,21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tradelab-forward-research
  cancel-in-progress: false

jobs:
  after_close:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Forward research and static dashboard
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: python cloud_update.py --scheduled
      - name: Save the append-only forward archive
        shell: bash
        run: |
          if [ -f reports/forward_archive.json ]; then
            git config user.name 'TradeLab Archive Bot'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add reports/forward_archive.json
            if ! git diff --cached --quiet; then
              git commit -m 'Archive new simulated forward market sessions [skip ci]'
              git push
            fi
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - uses: actions/deploy-pages@v4
        id: deployment
